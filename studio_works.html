  :root{
    --bg:        #f7f4ec;
    --surface:   #fffdf6;
    --ink:       #17160f;
    --ink-soft:  #4a4738;
    --ghost:     #c9c3ac;
    --line:      #d9d3bd;

    --accent:    #eec13a;
    --accent-ink:#221b06;
    --tile-1:    #eec13a;
    --tile-2:    #e0785a;
    --tile-2-ink:#2a1108;
    --tile-3:    #cdc5a9;

    --shadow: 0 1px 0 rgba(23,22,15,0.06);

    --font-heading: 'Clash Display', 'Fraunces', serif;
    --font-serif:   'Fraunces', serif;
    --font-mono:    'IBM Plex Mono', ui-monospace, monospace;
  }

  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:        #15140f;
      --surface:   #1c1a13;
      --ink:       #f2ede0;
      --ink-soft:  #b8b09b;
      --ghost:     #3a3626;
      --line:      #322e21;

      --accent:    #eec13a;
      --accent-ink:#221b06;
      --tile-1:    #eec13a;
      --tile-2:    #c65f3f;
      --tile-2-ink:#f6ece5;
      --tile-3:    #3a3627;
    }
  }

  :root[data-theme="dark"]{
    --bg:        #15140f;
    --surface:   #1c1a13;
    --ink:       #f2ede0;
    --ink-soft:  #b8b09b;
    --ghost:     #3a3626;
    --line:      #322e21;

    --accent:    #eec13a;
    --accent-ink:#221b06;
    --tile-1:    #eec13a;
    --tile-2:    #c65f3f;
    --tile-2-ink:#f6ece5;
    --tile-3:    #3a3627;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-mono);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .page{
    max-width:1400px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 clamp(20px,4vw,64px) 90px;
  }

  /* ---------- nav ---------- */
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:30px 0 26px;
    border-bottom:1px solid var(--line);
  }
  .nav-links{
    display:flex;
    gap:clamp(24px,5vw,56px);
    list-style:none;
    margin:0; padding:0;
  }

  .theme-switch{
    position:fixed;
    top:22px;
    right:clamp(20px,5vw,56px);
    z-index:20;
    width:40px;
    height:22px;
    padding:2px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--surface);
    cursor:pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  .theme-switch:hover{ border-color:var(--ghost); }
  .theme-switch-knob{
    display:block;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--accent);
    transform:translateX(0);
    transition: transform .22s cubic-bezier(.2,.8,.2,1);
  }
  .theme-switch[aria-checked="true"]{ background:var(--ghost); }
  .theme-switch[aria-checked="true"] .theme-switch-knob{
    transform:translateX(16px);
  }
  .nav-links a{
    color:var(--ink);
    text-decoration:none;
    font-size:11px;
    letter-spacing:.14em;
    font-weight:500;
    position:relative;
    padding-bottom:4px;
  }
  .nav-links a.current::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-5px;
    height:2px; background:var(--accent);
  }
  .nav-mark{
    font-family:var(--font-serif);
    font-style:italic;
    font-size:15px;
    color:var(--ink-soft);
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    padding:clamp(64px,16vh,180px) 0 40px;
  }
  .has-js .hero{
    opacity:0;
    transform:translateY(var(--hero-shift,0px));
    transition: opacity 1s cubic-bezier(.22,1,.36,1), transform 1.3s cubic-bezier(.76,0,.24,1);
  }
  .has-js .hero.in{ opacity:1; }
  .has-js .hero.rise{ transform:translateY(0); }
  h1{
    font-family:var(--font-heading);
    font-weight:400;
    font-size:clamp(44px,8vw,96px);
    line-height:1.0;
    letter-spacing:-.01em;
    margin:0;
    max-width:14ch;
  }
  .hero-line{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
  }
  .hero-img{
    display:inline-block;
    height:.833em;
    margin:0 .16em;
    border-radius:.083em;
    object-fit:cover;
    vertical-align:middle;
  }
  .has-js .hero-img{
    display:none;
    opacity:0;
  }
  .hero-img-1{ width:1.2604em; }
  .hero-img-2{ width:1.104em; }
  .hero-note{
    max-width:34ch;
    margin:26px 0 0;
    font-size:13px;
    line-height:1.7;
    color:var(--ink-soft);
  }

  /* ---------- practice index ---------- */
  .stack{
    display:flex;
    flex-direction:column;
  }

  .tile{
    --tile-h: 132px;
    position:relative;
    display:block;
    text-decoration:none;
    color:var(--ink);
    padding:20px clamp(20px,5vw,56px) 0;
    min-height:var(--tile-h);
    background:var(--tc);
    border-radius:16px 16px 0 0;
    clip-path: polygon(0 0, calc(100% - 210px) 0, calc(100% - 168px) 34px, 100% 34px, 100% 100%, 0 100%);
    margin-top:-34px;
    box-shadow: 0px 8px 6px rgba(0,0,0,0.15), 0px 4px 2px rgba(0,0,0,0.3);
    transition: filter .18s ease, min-height .28s cubic-bezier(.2,.8,.2,1), opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1);
  }
  .tile:first-child{ margin-top:0; clip-path:none; }
  .has-js .tile{ opacity:0; transform:translateY(36px) scale(.985); }
  .has-js .tile.in{ opacity:1; transform:translateY(0) scale(1); }
  .has-js .tile:nth-child(2){ transition-delay:0s, 0s, .12s, .12s; }
  .has-js .tile:nth-child(3){ transition-delay:0s, 0s, .24s, .24s; }

  .tile:hover{ filter:brightness(1.04); min-height:calc(var(--tile-h) + 18px); }
  .tile:active{ filter:brightness(0.97); }

  .tile-count{
    font-size:11px;
    letter-spacing:.06em;
    opacity:.55;
  }
  .tile-name{
    font-family:var(--font-heading);
    font-weight:500;
    font-size:clamp(34px,6.4vw,64px);
    line-height:1.02;
    margin:0 0 12px;
    text-wrap:balance;
  }
  .tile-arrow{
    position:absolute;
    right:clamp(20px,5vw,56px);
    top:26px;
    font-size:20px;
    transform:rotate(0deg);
    transition:transform .18s ease;
  }
  .tile:hover .tile-arrow{ transform:rotate(45deg); }

  .t1{ --tc:var(--tile-1); color:var(--accent-ink); }
  .t2{ --tc:var(--tile-2); color:var(--tile-2-ink); }
  .t3{ --tc:var(--tile-3); }

  .t1 .tile-count{ opacity:.7; }
  .t2 .tile-count{ opacity:.75; }

  /* ---------- footer ---------- */
  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid var(--line);
    margin-top:56px;
    padding-top:20px;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--ink-soft);
  }
  section[aria-label="Project shelves"]{
    margin-top:auto;
    padding-top:32px;
  }

  @media (max-width:640px){
    .tile{ clip-path:none; margin-top:0; border-top:1px solid var(--line); }
    .tile:first-child{ border-top:none; }
    .tile-arrow{ display:none; }
    footer{ flex-direction:column; align-items:flex-start; gap:6px; }
  }

  /* ---------- entrance animation ---------- */
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(-14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .has-js nav{
    animation:riseIn .8s cubic-bezier(.16,1,.3,1) .05s both;
  }
  .has-js footer{
    opacity:0;
    transform:translateY(36px);
    transition: opacity 1s cubic-bezier(.16,1,.3,1) .36s, transform 1s cubic-bezier(.16,1,.3,1) .36s;
  }
  .has-js footer.in{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .tile, .tile-arrow{ transition:none; }
    .tile:hover{ min-height:var(--tile-h); }
    .has-js nav, .has-js .hero, .has-js .hero-img, .has-js .tile, .has-js footer{
      animation:none !important;
      transition:none !important;
      opacity:1 !important;
      transform:none !important;
    }
    .has-js .hero-img{ display:inline-block !important; }
  }
</style>
